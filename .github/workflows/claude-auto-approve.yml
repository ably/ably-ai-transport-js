name: Claude Auto-Approve

# Two jobs, in order.
#
# `review` gates the PR on the rules in .claude/rules/ and CLAUDE.md that have
# one right answer, and reports whether the change makes a decision that should
# have been recorded in a DR first. It runs on every push, because a gate a
# fix cannot clear is not a gate.
#
# `auto-approve` then decides whether the PR is low-risk enough to approve
# without human review. It runs only at the moment the PR becomes review-ready,
# and only when the gate passed.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs are skipped: this is a public repo, so a pull_request run from a
    # fork has no access to the secrets below and could only ever fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Set at job level, not on the assessment step: the action's own env: block
    # shadows same-named step env vars, so a step-level value never reaches the
    # CLI. The API key belongs to a service account, which the API resolves to a
    # workspace only when the request names one. The CLI parses this as
    # newline-separated "Name: Value" pairs and sends them on every inference
    # request.
    env:
      ANTHROPIC_CUSTOM_HEADERS: 'anthropic-workspace-id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}'
    steps:
      - name: Check the workspace ID is configured
        env:
          WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          if [ -z "$WORKSPACE_ID" ]; then
            echo "::error::ANTHROPIC_WORKSPACE_ID secret is not set" >&2
            exit 1
          fi

      # Both gates diff two refs rather than the checkout, so they need the
      # history either end of the range: a shallow clone makes them exit 2.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      # The action replaces `.claude/` with the base branch's copy before Claude
      # starts, deleting whatever the base does not have, because the CLI reads
      # settings and hooks from there and a PR head is untrusted. The gate lives
      # under `.claude/skills/`, so it has to come out of git instead.
      - name: Materialise the gate
        run: .github/scripts/materialise-gate.sh "${{ github.event.pull_request.head.sha }}"

      - name: Run the rules gate
        uses: anthropics/claude-code-action@f87768c6d25f92ae6efa7175e223ef77d4cbf97f # v1
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.generate-token.outputs.token }}
          allowed_bots: 'dependabot[bot]'
          prompt: |
            Read `.gate/.claude/skills/code-review-ci/SKILL.md` and carry out every step it describes, against this range:

            - base: `${{ github.event.pull_request.base.sha }}`
            - head: `${{ github.event.pull_request.head.sha }}`

            Both are supplied, so skip Step 1 and pass both to each script. The checkout is the PR's merge commit, not its head, so never let a script default the head.

            The gate sits under `.gate/`, so prefix every `.claude/skills/...` path the document names with `.gate/` — the two scripts included. An earlier step has already checked they are all there; if a read or a run still fails, report that rather than searching for them elsewhere.

            Write the Step 4 report to `.gate/report/rules.md`, verdict line first, then the table and the cleared-candidate counts. Write nothing else anywhere, and post nothing to the PR — a later step does that.

            Writing that file is the only way this gate reports anything; a run that ends without it reads as a crash. So write it whatever happens, including when you could not run a script or complete a step — `VERDICT: ERROR` with what stopped you, in that case.
          claude_args: |
            --max-turns 30
            --model claude-sonnet-5
            --allowedTools "Read,Glob,Grep,Write,Bash(bash .gate/.claude/skills/code-review-ci/checks.sh:*),Bash(bash .gate/.claude/skills/code-review-ci/candidates.sh:*),Bash(git diff:*),Bash(git show:*),Bash(cat:*),Bash(head:*),Bash(wc:*),Bash(ls:*)"

      # Not gated on the rules gate having succeeded: the two answer unrelated
      # questions, and a crash in one should not silently drop the other.
      - name: Run the decision-record gate
        if: ${{ !cancelled() }}
        uses: anthropics/claude-code-action@f87768c6d25f92ae6efa7175e223ef77d4cbf97f # v1
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          # The script reads the PR number from the environment. Setting it here
          # rather than in front of the command keeps the command a literal
          # prefix of the `allowedTools` entry below, which is what that entry
          # matches on — a `VAR=x` in front of it does not match and is denied.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.generate-token.outputs.token }}
          allowed_bots: 'dependabot[bot]'
          prompt: |
            Read `.gate/.claude/skills/dr-required/SKILL.md` and carry out every step it describes, for PR #${{ github.event.pull_request.number }}.

            Run the signals script, once, exactly as:

            ```
            bash .gate/.claude/skills/dr-required/signals.sh ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
            ```

            `PR_NUMBER` is already in the environment, so do not set it on the command line — prefixing the command with an assignment puts it outside what you are permitted to run.

            Both refs are supplied there, so skip Step 1. An earlier step has already checked the script is at that path; if it still fails, report that rather than searching for it elsewhere.

            Write the Step 5 report to `.gate/report/dr.md`, verdict line first. Write nothing else anywhere, and post nothing to the PR — a later step does that.

            Writing that file is the only way this gate reports anything; a run that ends without it reads as a crash. So write it whatever happens, including when you could not run the script or complete a step — `VERDICT: ERROR` with what stopped you, in that case.
          claude_args: |
            --max-turns 8
            --model claude-sonnet-5
            --allowedTools "Read,Write,Bash(bash .gate/.claude/skills/dr-required/signals.sh:*),Bash(gh pr view:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(ls:*)"

      # Runs even when a gate step failed: a gate that crashed must still say so
      # on the PR, and must still fail the check rather than leave it green. Not
      # on cancellation, though — a superseded run has nothing to report.
      - name: Post the gate report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          .github/scripts/post-ci-review-comment.sh \
            "${{ github.event.pull_request.number }}" \
            .gate/report/rules.md \
            .gate/report/dr.md

  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: review
    # Once per PR, at the moment it becomes review-ready — a push re-runs the
    # gate but does not re-open the approval question. `needs` carries the rest:
    # a gate that failed, errored, or was skipped skips this job with it.
    if: >-
      github.event.action != 'synchronize' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      ANTHROPIC_CUSTOM_HEADERS: 'anthropic-workspace-id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Pre-fetch PR diff
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: .github/scripts/prefetch-pr-diff.sh "${{ github.event.pull_request.number }}" 8000

      - name: Run Claude assessment
        uses: anthropics/claude-code-action@f87768c6d25f92ae6efa7175e223ef77d4cbf97f # v1
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.generate-token.outputs.token }}
          allowed_bots: 'dependabot[bot]'
          prompt: |
            You are assessing PR #${{ github.event.pull_request.number }} in ${{ github.repository }} to decide whether it is low-risk enough to approve without human review.

            ## Inputs

            - The diff is at `/tmp/pr-diff.txt` (pre-fetched — do not run `gh pr diff`). Lockfiles have already been stripped.
            - PR title and description: get with `gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title,body,author`.
            - You have read access to the repo via the Read/Glob/Grep tools if you need to check how something is used.

            ## Decision

            Classify the PR into one of two buckets:

            **low-risk** — safe to approve without human review. Use your judgement. Examples of things that typically qualify:
            - Test-only changes (new tests, fixed flakes, refactored test helpers)
            - Comments, log messages, and documentation that is not published — CONTRIBUTING, repo tooling docs, notes that only a contributor reads
            - Editorial fixes to published documentation — typos, grammar, formatting, dead links — where the stated meaning is unchanged
            - Trivial dependency bumps (patch versions, dev-only deps, type-definition packages, where the diff doesn't suggest behaviour changes)
            - Pure formatting / lint fixes
            - CI changes to an existing workflow that leave its permissions, triggers, and secret usage as they are — bumping a pinned action, adjusting a test matrix, correcting a step's command, changing a timeout

            This is not exhaustive — apply judgement. The question to ask is "if this merged with no human review, what is the realistic worst case?" If the worst case is a small, easily-revertable issue and the change looks sound, it's low-risk.

            **needs-human** — should be reviewed by a human. Everything not classified as low-risk.

            Treat any change to published API surface as needs-human, including changes to an entry point's `index.ts` re-exports, even when the diff looks small.

            This repo's published API reference is generated from the JSDoc on exported members (see `typedoc.json`) and published to sdk.ably.com, so that JSDoc is public documentation rather than an internal comment. Treat a change to what it says the contract *is* — behaviour, defaults, guarantees, parameter or return semantics, errors thrown, whether something is safe to call — as needs-human, even when no signature changes. The same applies to usage examples in the README, which consumers copy verbatim. A purely editorial fix that leaves the stated contract identical stays low-risk.

            Treat a change to what CI is *allowed to do* as needs-human, however small the diff: a new workflow file, or an edit to a `permissions:` block, a trigger list, the secrets a job reads, or the scopes of a token it mints. The same goes for anything that changes who or what can approve, merge, or publish — including this auto-approve workflow and the scripts it calls. For this category the test is not whether the change is small, sound, or easy to revert; it is whether it widens what automation can do with no human in the loop.

            For dependabot PRs specifically: bumps of dev-only, test-only, or type-definition packages are low-risk. For other things, have a look around how the dependency is used in the repo and make a judgement call.

            A gate has already reviewed this PR against the repo's rules and passed it. That is the only thing it tells you: it checks a fixed list of mechanical rules, not whether the change is sound, so it is not evidence either way for the question you are answering here.

            ## Output

            Post your verdict by running exactly one command:

            ```
            .github/scripts/post-auto-approve-verdict.sh ${{ github.event.pull_request.number }} <low-risk|needs-human> "<rationale>"
            ```

            The script posts the verdict as a single PR review and picks the review state itself. Do not run `gh pr review` or `gh pr comment` yourself, and do not add a verdict line to the rationale — the script appends it.

            The rationale must be concise: 1-4 sentences, no headers, no severity markers, no inline annotations.

            ## Action

            After posting the verdict:

            - If your verdict is **needs-human** AND the PR author is `dependabot[bot]`: request review from the ait-reviewers team so a human gets pinged. Round-robin assignment will pick someone. First check whether reviewers are already requested:

              ```
              gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json reviewRequests
              ```

              If the list is empty, request review:

              ```
              gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-reviewer ably/ait-reviewers
              ```
            - Otherwise: do nothing further.
          claude_args: |
            --max-turns 15
            --model claude-sonnet-4-6
            --allowedTools "Read,Glob,Grep,Bash(.github/scripts/post-auto-approve-verdict.sh:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(ls:*),Bash(find:*)"
