name: Build and test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  BASE_NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.BASE_NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.BASE_NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check:error-codes

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: test node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only collect coverage on the base Node version to avoid redundant work
      - name: test with coverage
        if: ${{ matrix.node-version == env.BASE_NODE_VERSION }}
        run: pnpm test --coverage
      - name: test
        if: ${{ matrix.node-version != env.BASE_NODE_VERSION }}
        run: pnpm test
      # Post coverage summary as a PR comment. Restricted to PRs from the main
      # repo (not forks) because the action needs write permissions that fork
      # PRs don't have. Runs even if tests fail so we still get the report.
      - uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2.12.0
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == 'ably/ably-ai-transport-js' &&
          matrix.node-version == env.BASE_NODE_VERSION &&
          (failure() || success())

  test-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    name: test-integration node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration

  demo-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        demo:
          - demo/vercel/react/use-chat
          - demo/vercel/react/use-client-session
          - demo/vercel/react/use-chat-db
          - demo/vercel/react/use-client-session-db
    name: demo ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.BASE_NODE_VERSION }}
          cache: pnpm
      - name: pnpm install (lib)
        run: pnpm install --frozen-lockfile
      - name: pnpm run build (lib)
        run: pnpm run build
      # The shared-frontend workspace-linked package is a peer install-target
      # for every demo that consumes it. Installing here (rather than gating on
      # matrix.demo) is a no-op for demos that don't link it in, and keeps the
      # matrix rows uniform.
      - name: pnpm install (shared-frontend)
        run: pnpm install --frozen-lockfile
        working-directory: demo/shared-frontend
      - name: pnpm install (demo)
        run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.demo }}
      - name: pnpm run build (demo)
        run: pnpm run build
        working-directory: ${{ matrix.demo }}
        # Dummy keys for Next.js build - module-level SDK client initialization
        # runs during bundling even though the routes are never called at build time
        env:
          ABLY_API_KEY: dummy:key
      - name: pnpm test (demo)
        run: pnpm test
        working-directory: ${{ matrix.demo }}

  demo-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: demo/vercel/react/use-chat
            name: use-chat
          - demo: demo/vercel/react/use-client-session
            name: use-client-session
          - demo: demo/vercel/react/use-chat-db
            name: use-chat-db
          - demo: demo/vercel/react/use-client-session-db
            name: use-client-session-db
    name: demo-e2e ${{ matrix.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.BASE_NODE_VERSION }}
          cache: pnpm
      - name: pnpm install (lib)
        run: pnpm install --frozen-lockfile
      - name: pnpm run build (lib)
        run: pnpm run build
      # The shared-frontend workspace-linked package is a peer install-target
      # for every demo that consumes it. Installing here (rather than gating on
      # matrix.demo) is a no-op for demos that don't link it in, and keeps the
      # matrix rows uniform.
      - name: pnpm install (shared-frontend)
        run: pnpm install --frozen-lockfile
        working-directory: demo/shared-frontend
      - name: pnpm install (demo)
        run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.demo }}
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ${{ matrix.demo }}
      # Drives the demo over a real Ably sandbox channel with a deterministic
      # mock LLM. The runner provisions a throwaway sandbox app (no secrets) and
      # the Next.js dev server it starts needs no API keys. This job runs the
      # demo via `next dev` and does not type-check it; the parallel `demo-app`
      # job (`tsc --noEmit && next build`) covers type safety.
      - name: Run e2e (mock LLM + Ably sandbox)
        run: pnpm run test:e2e
        working-directory: ${{ matrix.demo }}
      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ matrix.name }}
          path: ${{ matrix.demo }}/test-results/
          retention-days: 7
