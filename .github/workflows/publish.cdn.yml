name: Publish to CDN

on:
  release:
    types: [published]
  # Manual trigger for re-deploying a tag to the CDN without re-firing the
  # release event (which would also re-run the npm publish workflow and fail on
  # the already-published version).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build from and deploy to the CDN (e.g. "0.5.0")'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # These permissions are necessary to run the configure-aws-credentials action
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # On release, github.ref/github.ref_name are empty, so read the tag
          # from the event payload; on workflow_dispatch, take it from the input.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.ABLY_AWS_ACCOUNT_ID_SDK }}:role/prod-ably-sdk-cdn
          role-session-name: ${{ github.run_id }}-${{ github.run_number }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # Caching is intentionally disabled: this workflow runs on release
      # publication, where a poisoned cache could affect the CDN artifact.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: ably/cdn-deploy-action@dc178d76905313bf41c220d8e324791ad822a3f6 # v1.0.2
        with:
          source-dir: dist
          file-regex: '^ably-ai-transport\.umd\.cjs$'
          tag: ${{ github.event.release.tag_name || inputs.tag }}
