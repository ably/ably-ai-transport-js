name: Publish to CDN

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # These permissions are necessary to run the configure-aws-credentials action
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # github.ref/github.ref_name are empty for release events; read the
          # tag from the event payload instead.
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.ABLY_AWS_ACCOUNT_ID_SDK }}:role/prod-ably-sdk-cdn
          role-session-name: ${{ github.run_id }}-${{ github.run_number }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # Caching is intentionally disabled: this workflow runs on release
      # publication, where a poisoned cache could affect the CDN artifact.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: ably/cdn-deploy-action@dc178d76905313bf41c220d8e324791ad822a3f6 # v1.0.2
        with:
          source-dir: dist
          file-regex: '^ably-ai-transport\.umd\.cjs$'
          tag: ${{ github.event.release.tag_name }}
