name: Publish to CDN

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # These permissions are necessary to run the configure-aws-credentials action
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # github.ref/github.ref_name are empty for release events; read the
          # tag from the event payload instead.
          ref: ${{ github.event.release.tag_name }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.ABLY_AWS_ACCOUNT_ID_SDK }}:role/prod-ably-sdk-cdn
          role-session-name: ${{ github.run_id }}-${{ github.run_number }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ably/cdn-deploy-action@v1
        with:
          source-dir: dist
          file-regex: '^ably-ai-transport\.umd\.cjs$'
          tag: ${{ github.event.release.tag_name }}
