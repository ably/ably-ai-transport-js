# Don't auto-install peer dependencies. This package declares `react`,
# `react-dom`, `ably`, and `ai` as peers so consumers inject their own
# copies via `transpilePackages`; installing them here would give
# consumers a second `react` instance and produce hooks-return-null
# at runtime. Also removes ambiguity across pnpm versions that changed
# the default (pnpm 9+ defaults to `true`; a `.npmrc` at this location
# isn't reliably picked up in every layout).
autoInstallPeers: false

# Standalone package: keep supply-chain hardening consistent with the demos.
allowBuilds:
  esbuild: true

# Match the demos' cooldown policy for public packages.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@ably/*'
  - 'ably'

# Pin ai / react to the exact versions the linked SDK was built against so
# tsc sees a single UIMessage / RealtimeChannel type identity between our
# node_modules and the SDK's dist declarations.
overrides:
  ai: '6.0.185'
  react: '19.2.6'
  react-dom: '19.2.6'
