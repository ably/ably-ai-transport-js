# Supply chain hardening: only allow build scripts for known packages.
allowBuilds:
  # Rust-based module resolver used by eslint-plugin-import-x.
  unrs-resolver: true
  # Image-processing native binary used by Next.js for image optimisation.
  sharp: true

# Reject packages published less than 7 days ago, except for Ably-owned
# packages which we trust without a cooldown.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@ably/*'
  - 'ably'

# Pin the peers shared with the linked @ably/ai-transport build (ai, react,
# react-dom) to the exact versions that build resolves, so the demo and the
# SDK share a single copy of each — otherwise TypeScript sees two unrelated
# copies of `ai`/`ably` types and rejects passing values between them.
overrides:
  ai: 6.0.185
  react: 19.2.6
  react-dom: 19.2.6
