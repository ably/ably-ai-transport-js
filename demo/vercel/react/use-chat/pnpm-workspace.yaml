# Supply chain hardening: only allow build scripts for known packages.
allowBuilds:
  # Rust-based module resolver used by eslint-plugin-import-x.
  unrs-resolver: true
  # Image-processing native binary used by Next.js for image optimisation.
  sharp: true

# Reject packages published less than 7 days ago, except for Ably-owned
# packages which we trust without a cooldown. AIT-1083: @shadcn/* is also
# excluded so this demo can adopt shadcn's brand-new chat components
# (@shadcn/react, the message-scroller engine) the day they ship. This is a
# demo-only allowance; the root SDK workspace keeps the cooldown unchanged.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@ably/*'
  - 'ably'
  - '@shadcn/*'
