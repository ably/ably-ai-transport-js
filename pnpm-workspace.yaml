# Supply chain hardening: only allow build scripts for known packages.
allowBuilds:
  # Pulled in transitively by @temporalio/worker's webpack toolchain. The
  # prebuilt platform binary is enough for the workflow bundling this repo's
  # temporal tier does, and the whole tier passes with the script skipped. A
  # demo that bundles workflows on a platform without a prebuilt binary needs
  # it enabled in its own workspace — demo/temporal/temporal-agent does.
  '@swc/core': false
  # Bundler used by vite; installs the platform-specific binary helper.
  esbuild: true
  # Also from @temporalio/worker: its postinstall generates the protobuf
  # accessors the worker loads at runtime.
  protobufjs: true
  # Rust-based module resolver used by eslint-plugin-import-x.
  unrs-resolver: true

# Reject packages published less than 7 days ago, except for Ably-owned
# packages which we trust without a cooldown.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@ably/*'
  - 'ably'
