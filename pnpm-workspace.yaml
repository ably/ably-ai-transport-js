# Supply chain hardening: only allow build scripts for known packages.
allowBuilds:
  # Bundler used by vite; installs the platform-specific binary helper.
  esbuild: true
  protobufjs: true
  # Rust-based module resolver used by eslint-plugin-import-x.
  unrs-resolver: true

# Reject packages published less than 7 days ago, except for Ably-owned
# packages which we trust without a cooldown.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@ably/*'
  - 'ably'
